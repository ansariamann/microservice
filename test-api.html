<!DOCTYPE html>
<html>
<head>
    <title>API Test</title>
</head>
<body>
    <h1>API Connectivity Test</h1>
    <button onclick="testRegistration()">Test Registration</button>
    <button onclick="testLogin()">Test Login</button>
    <div id="result"></div>

    <script>
        async function testRegistration() {
            const result = document.getElementById('result');
            try {
                const response = await fetch('http://localhost:8001/api/v1/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: 'Test User',
                        email: 'testuser@example.com',
                        password: 'testpass123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `<p style="color: green;">Registration Success: ${JSON.stringify(data)}</p>`;
                } else {
                    const error = await response.text();
                    result.innerHTML = `<p style="color: red;">Registration Error: ${response.status} - ${error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: red;">Network Error: ${error.message}</p>`;
            }
        }

        async function testLogin() {
            const result = document.getElementById('result');
            try {
                const response = await fetch('http://localhost:8001/api/v1/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'testuser@example.com',
                        password: 'testpass123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `<p style="color: green;">Login Success: ${JSON.stringify(data)}</p>`;
                } else {
                    const error = await response.text();
                    result.innerHTML = `<p style="color: red;">Login Error: ${response.status} - ${error}</p>`;
                }
            } catch (error) {
                result.innerHTML = `<p style="color: red;">Network Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
