# Fluentd configuration for Task Management System

<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# Parse Docker logs
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type json
  </parse>
</filter>

# Add service and environment labels
<filter docker.**>
  @type record_transformer
  <record>
    service ${record["attrs"]["labels"]["service"]}
    environment ${record["attrs"]["labels"]["environment"]}
    container_name ${record["attrs"]["name"]}
  </record>
</filter>

# Route logs by service
<match docker.task-mgmt-user-service>
  @type file
  path /var/log/fluentd/user-service
  append true
  time_slice_format %Y%m%d
  time_slice_wait 10m
  time_format %Y%m%dT%H%M%S%z
  format json
</match>

<match docker.task-mgmt-task-service>
  @type file
  path /var/log/fluentd/task-service
  append true
  time_slice_format %Y%m%d
  time_slice_wait 10m
  time_format %Y%m%dT%H%M%S%z
  format json
</match>

<match docker.task-mgmt-notification-service>
  @type file
  path /var/log/fluentd/notification-service
  append true
  time_slice_format %Y%m%d
  time_slice_wait 10m
  time_format %Y%m%dT%H%M%S%z
  format json
</match>

<match docker.task-mgmt-nginx>
  @type file
  path /var/log/fluentd/nginx
  append true
  time_slice_format %Y%m%d
  time_slice_wait 10m
  time_format %Y%m%dT%H%M%S%z
  format json
</match>

# Catch all other logs
<match **>
  @type file
  path /var/log/fluentd/all
  append true
  time_slice_format %Y%m%d
  time_slice_wait 10m
  time_format %Y%m%dT%H%M%S%z
  format json
</match>