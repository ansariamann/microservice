# Main server configuration for Task Management System
server {
    listen 80;
    server_name localhost;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Nginx status endpoint for monitoring
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.20.0.0/16; # Docker network
        deny all;
    }

    # Metrics endpoint for monitoring
    location /metrics {
        access_log off;
        return 200 "# Nginx metrics endpoint\n";
        add_header Content-Type text/plain;
        allow 127.0.0.1;
        allow 172.20.0.0/16; # Docker network
        deny all;
    }

    # API routes with rate limiting
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://user_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/users/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://user_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/profile {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://user_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/register {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://user_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/login {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://user_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/tasks {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://task_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    location /api/v1/notifications {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://notification_service;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Frontend static files
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
        
        # Special handling for React Router
        try_files $uri $uri/ @fallback;
    }

    # Fallback for React Router (SPA)
    location @fallback {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        include /etc/nginx/conf.d/proxy_params.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}